name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The tag is the package's version
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release candidate tag such as v0.1.0-rc.1" >&2
            exit 1
          fi
          if [ "$declared" != "$version" ]; then
            echo "package.json says $declared, the tag says $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack twice, compare, and probe the package
        run: pnpm pack:check --out "$RUNNER_TEMP/packs"

      - name: Verify the release asset and publish the candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          asset="penguinharness-rsi-workbench-$VERSION.tgz"
          packed="$RUNNER_TEMP/packs/pack-1/$asset"
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = ($1 " " $2 == heading); next }
            found { print }
          ' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes"

          if ! gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --latest=false \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          prerelease=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)
          test "$prerelease" = true
          if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx "$asset"; then
            test "$draft" = true
            gh release upload "$GITHUB_REF_NAME" "$packed"
          fi
          gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$RUNNER_TEMP/download"
          cmp "$packed" "$RUNNER_TEMP/download/$asset"
          sha512sum "$RUNNER_TEMP/download/$asset"
          if [ "$draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          fi

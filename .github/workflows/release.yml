name: release

on:
  push:
    tags:
      - "v*"
  # Publishes an existing Release's tarballs to npm without a new tag: only the npm job runs.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag whose tarballs go to npm, for example v0.1.0"
        required: true
        type: string
      skip:
        description: "Package names to leave out, separated by spaces"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The tag is the package's version
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Expected a version tag such as v0.1.0, or v0.1.0-rc.1 for a release candidate" >&2
            exit 1
          fi
          if [ "$declared" != "$version" ]; then
            echo "package.json says $declared, the tag says $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack twice, compare, and probe the package
        run: pnpm pack:check --out "$RUNNER_TEMP/packs"

      - name: Verify the release assets and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = ($1 " " $2 == heading); next }
            found { print }
          ' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes"

          # An -rc version is a GitHub prerelease; a plain version is a stable release and the latest.
          if [[ "$VERSION" == *-rc.* ]]; then
            expected=true
            kind=(--prerelease --latest=false)
          else
            expected=false
            kind=(--prerelease=false --latest)
          fi
          if ! gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft "${kind[@]}" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          prerelease=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)
          test "$prerelease" = "$expected"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"
          for packed in "$RUNNER_TEMP/packs/pack-1/"*.tgz; do
            asset=$(basename "$packed")
            if ! grep -Fx "$asset" "$RUNNER_TEMP/release-assets"; then
              test "$draft" = true
              gh release upload "$GITHUB_REF_NAME" "$packed"
            fi
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$RUNNER_TEMP/download"
            cmp "$packed" "$RUNNER_TEMP/download/$asset"
            sha512sum "$RUNNER_TEMP/download/$asset"
          done
          for packed in "$RUNNER_TEMP/packs/pack-1/"*.tgz; do basename "$packed"; done | sort > "$RUNNER_TEMP/expected-assets"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/published-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/published-assets"
          if [ "$draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false "${kind[@]}"
          fi

  # npm serves the very tarballs the Release carries, so the plugin index pins one sha512 for both
  # channels. Skipped until the repository variable NPM_TRUSTED_PUBLISHING is 'true': trusted
  # publishing cannot create a name, so each package is first published once by hand from a
  # Release asset and given this workflow and the `npm` environment as its Trusted Publisher.
  # A package npm has never seen is skipped with a warning and the others are still published.
  # A manual run publishes the tarballs of the Release its `tag` input names and builds nothing.
  publish-npm:
    name: Publish the Release tarballs to npm
    needs: release
    if: >-
      ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && !cancelled() &&
          (needs.release.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: npm
      url: https://www.npmjs.com/org/penguinharness
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          V="$(npm --version)"
          echo "npm $V"
          node -e 'const [M, m, p] = process.argv[1].split(".").map(Number); if (M < 11 || (M === 11 && (m < 5 || (m === 5 && p < 1)))) { console.error("npm " + process.argv[1] + " < 11.5.1"); process.exit(1); }' "$V"

      - name: Download the tarballs the Release carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir packs

      # A version npm already has is skipped, and must be the Release's bytes. A prerelease goes
      # under the `rc` dist-tag (npm refuses one without a tag), so `latest` keeps naming the
      # newest stable version.
      # The path starts with ./ because npm reads a bare `packs/<file>.tgz` as a GitHub
      # `owner/repository` shorthand and tries to clone it.
      - name: Publish each tarball npm does not have yet
        env:
          SKIP: ${{ github.event_name == 'workflow_dispatch' && inputs.skip || '' }}
        run: |
          set -euo pipefail
          failed=0
          for file in ./packs/*.tgz; do
            manifest="$(tar -xzOf "$file" package/package.json)"
            name="$(printf '%s' "$manifest" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            version="$(printf '%s' "$manifest" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            integrity="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            case " $SKIP " in
              *" $name "*)
                echo "$name@$version is left out by the skip input."
                continue
                ;;
            esac
            if [ -z "$(npm view "$name" name 2>/dev/null || true)" ]; then
              echo "::warning::$name has never been published to npm, so it is skipped. Publish $(basename "$file") from this Release once by hand and set its Trusted Publisher to this workflow and the npm environment."
              continue
            fi
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [ -n "$published" ]; then
              if [ "$published" != "$integrity" ]; then
                echo "::error::$name@$version is on npm as $published, but this Release carries $integrity."
                failed=1
              else
                echo "$name@$version is already on npm with the same bytes."
              fi
              continue
            fi
            case "$version" in
              *-*) npm publish "$file" --provenance --access public --tag rc ;;
              *) npm publish "$file" --provenance --access public ;;
            esac
          done
          exit "$failed"
